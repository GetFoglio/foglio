name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # On the custom domain (repository variable CUSTOM_DOMAIN set, e.g. getfoglio.app) the site
      # lives at the root; without it, it is served from https://<owner>.github.io/foglio/.
      - name: Build
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then export NEXT_PUBLIC_BASE_PATH=""; else export NEXT_PUBLIC_BASE_PATH="/${GITHUB_REPOSITORY#*/}"; fi
          npm run build
          touch out/.nojekyll
      # GitHub Pages serves the gh-pages branch (same result as scripts/deploy_site.sh).
      - name: Publish to gh-pages
        if: github.event_name != 'pull_request'
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then echo "$CUSTOM_DOMAIN" > out/CNAME; fi
          cd out
          git init -q -b gh-pages
          git config user.name "Acid236"
          git config user.email "nicolodibenedetto236@gmail.com"
          git add -A
          git commit -qm "Website build from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
